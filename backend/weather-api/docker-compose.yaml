services:
  postgres:
    image: postgres:16
    container_name: nest_postgres
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}                      
      POSTGRES_USER: ${DB_USERNAME}                 
      POSTGRES_PASSWORD: ${DB_PASSWORD}        

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
